name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The low end is the package's own `engines.node`. There are no
        # dependencies, so there is nothing to install and nothing to build.
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Report the runtime under test
        run: node --version

      - name: Reject a package that cannot be loaded
        run: |
          node --check lib/index.js
          node --check lib/client.js

      - name: Run the test suite
        run: node --test tests/host.test.mjs tests/routes.test.mjs tests/client.test.mjs
